<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 520" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="adcShieldEdge" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B6EF3"/>
      <stop offset="100%" stop-color="#062040"/>
    </linearGradient>
    <linearGradient id="adcRoad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#0A2A50"/>
      <stop offset="100%" stop-color="#062040"/>
    </linearGradient>
  </defs>

  <!-- Shield outline -->
  <path d="M120 70 H360 V230 C360 300 320 350 240 380 C160 350 120 300 120 230 Z"
        fill="none" stroke="url(#adcShieldEdge)" stroke-width="14" stroke-linejoin="round"/>

  <!-- Circuit traces (left side) -->
  <g stroke="#1B6EF3" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M150 170 H230"/>
    <path d="M150 200 H210 L225 215 H250"/>
    <path d="M150 230 H240"/>
    <path d="M150 260 H220"/>
    <path d="M150 290 H230"/>
  </g>
  <g fill="#1B6EF3">
    <circle cx="148" cy="170" r="7"/>
    <circle cx="148" cy="200" r="7"/>
    <circle cx="148" cy="230" r="7"/>
    <circle cx="148" cy="260" r="7"/>
    <circle cx="148" cy="290" r="7"/>
  </g>

  <!-- Road sweeping through shield -->
  <path d="M340 95 C 320 170, 300 240, 250 360 L 215 360 C 265 240, 285 170, 310 95 Z"
        fill="url(#adcRoad)"/>
  <!-- Road centerline (dashed) -->
  <path d="M325 110 C 305 180, 285 250, 240 355"
        fill="none" stroke="#FFFFFF" stroke-width="4"
        stroke-linecap="round" stroke-dasharray="10 14"/>

  <!-- Wordmark: ADC -->
  <text x="240" y="455" text-anchor="middle"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-weight="800" font-size="110" letter-spacing="2" fill="#062040">ADC</text>

  <!-- Subtitle -->
  <text x="240" y="490" text-anchor="middle"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="22" letter-spacing="4" fill="#062040">ACCIDENT DEFENSE CENTER</text>

  <!-- Accent rule -->
  <line x1="195" y1="505" x2="285" y2="505" stroke="#1B6EF3" stroke-width="3" stroke-linecap="round"/>
</svg>
