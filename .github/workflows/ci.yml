name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint/type/tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest

      - name: Duplicate module guard
        run: python ../scripts/check_no_duplicate_modules.py

      - name: Lint (ruff)
        run: ruff check app/ tests/

      - name: Type check (mypy critical modules)
        run: mypy --ignore-missing-imports app/core/config.py app/services/schema_validate.py

      - name: Tests (pytest)
        run: pytest tests/ -v

  frontend:
    name: Frontend lint/type/tests/build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build (next)
        run: npm run build

  migration-integrity:
    name: Migration integrity checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Verify Alembic chain integrity
        run: pytest tests/test_migration_integrity.py -v

  schema-validation:
    name: Schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install jsonschema

      - name: Validate contract schemas
        run: python scripts/validate_schemas.py

  dependency-vulnerability-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install scanners
        run: |
          pip install --upgrade pip
          pip install pip-audit

      - name: Backend vulnerability scan (pip-audit)
        run: pip-audit -r backend/requirements.txt

      - name: Frontend vulnerability scan (npm audit)
        working-directory: frontend
        run: npm audit --audit-level=high

  required-checks:
    name: Required checks gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - migration-integrity
      - schema-validation
      - dependency-vulnerability-scan
    steps:
      - name: All required checks passed
        run: echo "All required CI checks passed. Safe to merge once branch protections require this check."
