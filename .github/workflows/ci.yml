name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint/type/tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest

      - name: Duplicate module guard
        run: python ../scripts/check_no_duplicate_modules.py

      - name: Lint (ruff)
        run: ruff check app/ tests/

      - name: Type check (mypy critical modules)
        run: mypy --ignore-missing-imports app/core/config.py app/services/schema_validate.py

      - name: Targeted weather/initiation regression tests
        run: pytest tests/services/test_nws_client.py tests/services/test_nws_parser.py tests/services/test_weather_snapshot_service.py tests/test_incident_location_resolver.py tests/test_incident_workflow_service.py tests/test_api_endpoints.py::TestDriverIncidentInitiationDuplicateBehavior tests/test_driver_admin_endpoints.py -v

      - name: Tests (pytest)
        run: pytest tests/ -v

  frontend:
    name: Frontend lint/type/tests/build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build (next)
        run: npm run build

  driver-app:
    name: Driver app tests + coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: driver-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: driver-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Tests with coverage (enforces thresholds)
        # ``test:coverage`` runs both the ``unit`` and ``rntl`` Jest
        # projects and applies the global coverage thresholds defined in
        # driver-app/jest.config.js. A drop below those thresholds will
        # exit non-zero and fail this job.
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driver-app-coverage
          path: driver-app/coverage/
          if-no-files-found: ignore
          retention-days: 14

  migration-integrity:
    name: Migration integrity checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Verify Alembic chain integrity
        run: pytest tests/test_migration_integrity.py -v

  schema-validation:
    name: Schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install jsonschema

      - name: Validate contract schemas
        run: python scripts/validate_schemas.py

      - name: Check runtime API contract drift
        run: python scripts/generate_runtime_api_contract.py --check

  dependency-vulnerability-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install scanners
        run: |
          pip install --upgrade pip
          pip install pip-audit

      - name: Backend vulnerability scan (pip-audit)
        run: pip-audit -r backend/requirements.txt

      - name: Frontend vulnerability scan (npm audit)
        working-directory: frontend
        run: npm audit --audit-level=critical

  required-checks:
    name: Required checks gate
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - driver-app
      - migration-integrity
      - schema-validation
      - dependency-vulnerability-scan
    steps:
      - name: Validate upstream job outcomes
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          DRIVER_APP_RESULT: ${{ needs.driver-app.result }}
          MIGRATION_RESULT: ${{ needs.migration-integrity.result }}
          SCHEMA_RESULT: ${{ needs.schema-validation.result }}
          VULN_RESULT: ${{ needs.dependency-vulnerability-scan.result }}
        run: |
          results=("$BACKEND_RESULT" "$FRONTEND_RESULT" "$DRIVER_APP_RESULT" "$MIGRATION_RESULT" "$SCHEMA_RESULT" "$VULN_RESULT")
          for result in "${results[@]}"; do
            if [[ "$result" != "success" ]]; then
              echo "Required CI dependency failed or was skipped: $result"
              exit 1
            fi
          done
          echo "All required CI checks passed."
