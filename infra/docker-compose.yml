version: "3.9"

services:
  app:
    build: ../backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://adc:adc@db:5432/adc_mvp
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=change-me-in-production
      - STORAGE_BACKEND=fs
      - VAULT_ROOT=/var/adc/vault
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_VERIFY_SERVICE_SID=${TWILIO_VERIFY_SERVICE_SID:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - S3_ARTIFACTS_BUCKET=${S3_ARTIFACTS_BUCKET:-adc-mvp-artifacts}
      - S3_EXPORTS_BUCKET=${S3_EXPORTS_BUCKET:-adc-mvp-exports}
    volumes:
      - vaultdata:/var/adc/vault
    depends_on:
      - db
      - redis

  worker:
    build: ../backend
    command: celery -A app.tasks.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://adc:adc@db:5432/adc_mvp
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_BACKEND=fs
      - VAULT_ROOT=/var/adc/vault
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_VERIFY_SERVICE_SID=${TWILIO_VERIFY_SERVICE_SID:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - S3_ARTIFACTS_BUCKET=${S3_ARTIFACTS_BUCKET:-adc-mvp-artifacts}
      - S3_EXPORTS_BUCKET=${S3_EXPORTS_BUCKET:-adc-mvp-exports}
    volumes:
      - vaultdata:/var/adc/vault
    depends_on:
      - db
      - redis

  frontend:
    build: ../frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
      - API_INTERNAL_BASE_URL=http://app:8000
    depends_on:
      - app

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: adc
      POSTGRES_PASSWORD: adc
      POSTGRES_DB: adc_mvp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
  vaultdata:
