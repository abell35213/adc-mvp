version: "3.9"

services:
  app:
    build: ../backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=${APP_ENV:-staging}
      - SECRET_PROVIDER=${SECRET_PROVIDER:-aws_secrets_manager}
      - AWS_SECRETS_MANAGER_SECRET_ID=${AWS_SECRETS_MANAGER_SECRET_ID:?set by your secret provider}
      - AWS_SECRETS_MANAGER_VERSION_STAGE=${AWS_SECRETS_MANAGER_VERSION_STAGE:-AWSCURRENT}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - STORAGE_BACKEND=fs
      - VAULT_ROOT=/var/adc/vault
    volumes:
      - vaultdata:/var/adc/vault
    depends_on:
      - db
      - redis

  worker:
    build: ../backend
    command: celery -A app.tasks.celery_app worker --loglevel=info
    environment:
      - APP_ENV=${APP_ENV:-staging}
      - SECRET_PROVIDER=${SECRET_PROVIDER:-aws_secrets_manager}
      - AWS_SECRETS_MANAGER_SECRET_ID=${AWS_SECRETS_MANAGER_SECRET_ID:?set by your secret provider}
      - AWS_SECRETS_MANAGER_VERSION_STAGE=${AWS_SECRETS_MANAGER_VERSION_STAGE:-AWSCURRENT}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - STORAGE_BACKEND=fs
      - VAULT_ROOT=/var/adc/vault
    volumes:
      - vaultdata:/var/adc/vault
    depends_on:
      - db
      - redis

  frontend:
    build: ../frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
      - API_INTERNAL_BASE_URL=http://app:8000
    depends_on:
      - app

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: adc
      POSTGRES_PASSWORD: adc
      POSTGRES_DB: adc_mvp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
  vaultdata:
