---
# Dedicated ServiceAccount for the backend / worker / backup pods.
#
# We do not bind any Role or ClusterRole to this account on purpose: ADC
# workloads have no business calling the Kubernetes API at runtime. Cluster
# operators who need to grant the account access to a namespaced resource
# (for example, a custom external-secrets RoleBinding) should add that binding
# in a separate manifest so that the principle of least privilege remains
# auditable from this file alone.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: adc-backend
  namespace: adc
  labels:
    app.kubernetes.io/name: adc-backend
    app.kubernetes.io/component: serviceaccount
# Disable automatic token mounting — workloads should opt in explicitly via
# `automountServiceAccountToken: true` in their pod spec if they ever need it.
automountServiceAccountToken: false
