apiVersion: v1
kind: ConfigMap
metadata:
  name: adc-postgres-backup-policy
  namespace: adc
data:
  retention_days_daily: "35"
  retention_weeks_weekly: "12"
  retention_months_monthly: "12"
  wal_retention_days: "35"
  backup_schedule_utc: "*/5 * * * *"
  full_snapshot_schedule_utc: "0 2 * * *"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: adc-postgres-wal-archive
  namespace: adc
spec:
  schedule: "*/5 * * * *"
  successfulJobsHistoryLimit: 6
  failedJobsHistoryLimit: 12
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: adc-backend
          restartPolicy: OnFailure
          containers:
            - name: wal-archive
              # Tag is rendered by the deploy pipeline. Avoid ":latest" so backup-job
              # behavior cannot drift between runs.
              image: ghcr.io/your-org/adc-ops:${ADC_OPS_IMAGE_TAG}
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
              command:
                - /bin/sh
                - -c
                - >-
                  ./scripts/backup/run_pg_wal_archive.sh
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: adc-runtime-settings
                      key: DATABASE_URL
                - name: PG_BACKUP_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: adc-runtime-settings
                      key: PG_BACKUP_BUCKET
                - name: AWS_REGION
                  value: us-east-1
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: adc-postgres-full-backup
  namespace: adc
spec:
  schedule: "0 2 * * *"
  successfulJobsHistoryLimit: 14
  failedJobsHistoryLimit: 14
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: adc-backend
          restartPolicy: OnFailure
          containers:
            - name: pg-full-backup
              image: ghcr.io/your-org/adc-ops:${ADC_OPS_IMAGE_TAG}
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                limits:
                  cpu: "1000m"
                  memory: "1Gi"
              command:
                - /bin/sh
                - -c
                - >-
                  ./scripts/backup/run_pg_full_backup.sh
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: adc-runtime-settings
                      key: DATABASE_URL
                - name: PG_BACKUP_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: adc-runtime-settings
                      key: PG_BACKUP_BUCKET
                - name: AWS_REGION
                  value: us-east-1
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
