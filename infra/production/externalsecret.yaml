apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: adc-aws-secrets
  namespace: adc
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: adc-backend
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: adc-runtime-settings
  namespace: adc
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: adc-aws-secrets
  target:
    name: adc-runtime-settings
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: adc/prod/runtime-settings
---
apiVersion: v1
kind: Secret
metadata:
  name: adc-runtime-secret-ref
  namespace: adc
type: Opaque
stringData:
  # This secret only contains an identifier pointer; actual values live in AWS Secrets Manager.
  secret_id: adc/prod/runtime-settings
  version_stage: AWSCURRENT
