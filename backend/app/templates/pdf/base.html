<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{% block title %}ADC Document{% endblock %}</title>
  <style>{% include "static/base.css" %}</style>
  {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% if is_sample %}sample-document{% endif %}{% endblock %}">
  {% if is_sample %}
  <div class="sample-banner">
    SAMPLE DOCUMENT — Generated from fictitious data for demonstration only. Not a real incident, claim, or filing.
  </div>
  {% endif %}
  {% block body %}{% endblock %}
</body>
</html>
